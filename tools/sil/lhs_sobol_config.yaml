# D1.7 LHS/Sobol Monte Carlo configuration for farn scenario sampling engine.
# Usage (DEMO-1 dry-run):  farn sample --config lhs_sobol_config.yaml --n 1 --output scenarios/colregs/lhs_dry_run.yaml
# Usage (D3.6 full run):   farn sample --config lhs_sobol_config.yaml --n 10000

sampling:
  method: lhs          # "lhs" | "sobol" | "random"
  n_samples: 10000     # D3.6 实跑目标
  seed: 42             # 可复现性

parameters:
  target_bearing_initial:
    distribution: uniform
    bounds: [0.0, 360.0]
    unit: deg

  target_sog_initial:
    distribution: uniform
    bounds: [0.0, 25.0]
    unit: kn

  target_range_initial:
    distribution: lognormal
    params: {mu: 2.0, sigma: 0.5}
    bounds: [0.5, 10.0]
    unit: NM

  wind_speed:
    distribution: gumbel
    params: {mu: 8.0, beta: 3.0}
    bounds: [0.0, 35.0]
    unit: kn

  wind_direction:
    distribution: uniform
    bounds: [0.0, 360.0]
    unit: deg

  current_speed:
    distribution: exponential
    params: {lambda: 0.5}
    bounds: [0.0, 5.0]
    unit: kn

  current_direction:
    distribution: uniform
    bounds: [0.0, 360.0]
    unit: deg

  vis_range:
    distribution: truncated_normal
    params: {mu: 10.0, sigma: 3.0}
    bounds: [0.1, 20.0]
    unit: NM

  sensor_noise_range:
    distribution: uniform
    bounds: [0.5, 5.0]
    unit: m

  sensor_noise_bearing:
    distribution: uniform
    bounds: [0.1, 2.0]
    unit: deg

  own_ship_sog:
    distribution: uniform
    bounds: [3.0, 12.0]
    unit: kn

filter:
  # COLREG geometric filter (Hassani 2022 [R32])
  type: colreg_geometric
  dcpa_max_nm: 2.0
  tcpa_max_min: 30
  # Only keep encounters with risk of collision
  collision_risk_threshold_nm: 0.27  # CPA_target [TBD-HAZID-CPA-001]

output:
  format: yaml           # maritime-schema YAML
  directory: scenarios/lhs_generated/
  metadata:
    tool: farn
    config: lhs_sobol_config.yaml
    generated_by: D1.7
