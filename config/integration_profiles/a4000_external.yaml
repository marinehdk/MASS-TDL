name: a4000_external
mode: external
tdl_domain_id: 42
adapters:
  simulation: enabled
  yougc: enabled
  route_level_closed_loop: enabled
external_domains:
  simulation:
    domain_id: 10
    setup: /home/mass/simulation/船舶动力学/gnc_ws/install/setup.bash
    required_topics:
      /route_planning/route_plan: ship_interfaces/msg/RoutePlan
      /ship/waypoints: nav_msgs/msg/Path
      /ship/odometry: nav_msgs/msg/Odometry
  yougc:
    domain_id: 11
    setup: /home/mass/yougc/ros2_ws/install/setup.bash
    required_topics:
      /fusion/tracked_targets: nmea_interfaces/msg/TrackedTargetArray
      /gps/fix: nmea_interfaces/msg/Gps
      /heading: nmea_interfaces/msg/Heading
freshness:
  ownship_ms: 500
  targets_ms: 2000
  environment_ms: 10000
safety:
  route_out_requires_screen02_pass: true
  forbid_low_level_control: true
