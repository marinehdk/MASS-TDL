# A4000 shared-host override: remap app bind ports off jitsi(8000)/other(8765),
# cap CPU to stay a good neighbour, and isolate DDS via ROS_DOMAIN_ID=42.
# Apply with: docker compose -f docker-compose.yml -f docker-compose.a4000.yml ...
# (or set COMPOSE_FILE — see scripts/a4000-env.sh)
services:
  sil-orchestrator:
    cpus: ${SIL_ORCHESTRATOR_CPUS:-1.5} # cap: good neighbour on shared host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /bin/bash
      - -c
      - "source /opt/ros/humble/setup.bash && source /opt/sil/install/setup.bash && python3 -m uvicorn sil_orchestrator.main:app --host 0.0.0.0 --port 18000 --ssl-certfile /certs/sil.crt --ssl-keyfile /certs/sil.key"
    environment:
      - ROS_DOMAIN_ID=42
      - FOX_PORT=18765
      - TDL_RUNTIME_PROFILE=${TDL_RUNTIME_PROFILE:-internal-local}
      # ROS_LOCALHOST_ONLY=1 disabled: CycloneDDS on Ubuntu 22.04's loopback
      # interface is not multicast-capable, so forcing localhost-only disables
      # DDS discovery entirely (ros2 node list returns 0). ROS_DOMAIN_ID=42
      # alone scopes our DDS traffic; the LAN has no other ID-42 stacks.

  sil-nodes:
    cpus: ${SIL_NODES_CPUS:-12.0}   # heaviest (250Hz clock + RK4 + all M-nodes); leaves ~5 threads for jitsi/fat
    environment:
      - ROS_DOMAIN_ID=42
      - SIL_L4_ADAPTER_ENABLE=1
      - SIL_BRIDGE_RELEASE_FALLBACK=0
      - TDL_INTEGRATION_PROFILE=${TDL_INTEGRATION_PROFILE:-default}
      - TDL_RUNTIME_PROFILE=${TDL_RUNTIME_PROFILE:-internal-local}

  foxglove-bridge:
    cpus: ${FOXGLOVE_CPUS:-1.5}
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash &&
        source /opt/ws/install/setup.bash &&
        ros2 run foxglove_bridge foxglove_bridge \
          --ros-args \
          -p port:=18765 \
          -p num_threads:=4 \
          -p send_buffer_limit:=10000000 \
          -p use_sim_time:=true \
          -p certfile:=/certs/sil.crt \
          -p keyfile:=/certs/sil.key \
          -p topic_whitelist:="[/sim_clock,/sil/own_ship_state,/sil/target_vessel_state,/sil/radar_meas,/sil/ais_msg,/sil/environment,/sil/tracked_targets,/sil/lifecycle_status,/sil/module_pulse,/sil/scoring,/sil/asdr_event,/sil/sat2_data,/sil/sat3_data,/sil/sotif_metrics,/l3/fsm_state,/l3/m1/odd_state,/l3/m2/world_state,/l3/m4/behavior_plan,/l3/m5/avoidance_plan,/l3/m6/colregs_constraint,/l3/m7/safety_alert,/l3/m8/threat_state,/l2/planned_route,/fusion/tracked_targets]"
    environment:
      - ROS_DOMAIN_ID=42
