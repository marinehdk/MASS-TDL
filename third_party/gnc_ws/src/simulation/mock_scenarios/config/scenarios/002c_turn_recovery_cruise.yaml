scenario_id: 002c_turn_recovery_cruise
scenario_class: captain_operational
description: Short calm-water validation for explicit captain-style speed recovery after a planned turn.
validation_objective: Verify that a 45m crewboat reduces speed for a planned turn, waits for corridor/heading/yaw-rate recovery, then restores cruise speed on a post-turn cruise leg.
seed: 1203
duration_s: 720
publish_rate_hz: 10

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace mock route gates and vessel limits with route-planner/ECDIS/operator and sea-trial data; recalibrate values without changing mission, safety, guidance, control, or allocation interfaces.

own_ship:
  initial_pose: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  initial_velocity: {u: 8.0, v: 0.0, r_deg_s: 0.0}
  nominal_speed_mps: 8.0
  waypoints:
    - [0.0, 0.0]
    - [500.0, 0.0]
    - [900.0, 100.0]
    - [2200.0, 100.0]
    - [2500.0, 100.0]

route_plan:
  schema_version: route_plan.v1
  vessel_profile_ref: crewboat_45m_c_mock
  coordinate_frame: local_enu
  parameter_source: mock_data
  parameter_confidence: C
  route_intent:
    type: post_turn_cruise_recovery
    priority: safety_over_schedule
    completion_policy: recover_cruise_only_after_turn_completed_gate
    description: C-level mock RoutePlan for validating explicit speed recovery after a planned low-speed turn.
  captain_intent:
    nominal_cruise_speed_mps: 8.0
    maneuvering_speed_range_mps: [3.2, 4.2]
    final_approach_speed_mps: 2.2
    hold_speed_mps: 0.35
    speed_is_hard_limit: false
    schedule_priority: secondary_to_safety
  speed_recovery_policy:
    enabled: true
    parameter_source: mock_data
    parameter_confidence: C
    applies_when_next_navigation_mode: [cruise, open_water_cruise, post_turn_cruise]
    max_xte_m: 35.0
    max_heading_error_deg: 8.0
    max_yaw_rate_deg_s: 0.5
    max_cross_track_rate_mps: 0.30
    speed_margin_mps: 0.5
    speed_ramp_mps2: 0.35
    validation_ignore_entry_distance_m: 120.0
  vessel_profile:
    length_overall_m: 45.0
    propulsion_layout: 3_fixed_main_propellers_2_tunnel_thrusters_2_rudders
    parameter_source: mock_data
    parameter_confidence: C
  waypoint_plan:
    points:
      - {id: wp0, index: 0, local_xy_m: [0.0, 0.0], role: start, coordinate_confidence: C}
      - {id: wp1, index: 1, local_xy_m: [500.0, 0.0], role: turn_entry_gate, coordinate_confidence: C}
      - {id: wp2, index: 2, local_xy_m: [900.0, 100.0], role: turn_exit_gate, coordinate_confidence: C}
      - {id: wp3, index: 3, local_xy_m: [2200.0, 100.0], role: post_turn_cruise_gate, coordinate_confidence: C}
      - {id: wp4, index: 4, local_xy_m: [2500.0, 100.0], role: final_hold, coordinate_confidence: C}
  leg_plan:
    - {id: leg0, from: wp0, to: wp1, planned_cog_deg: 0.0, distance_m: 500.0, xtl_port_m: 25.0, xtl_starboard_m: 25.0, speed_limit_mps: 8.0, navigation_mode: cruise}
    - {id: leg1, from: wp1, to: wp2, planned_cog_deg: 14.04, distance_m: 412.31, xtl_port_m: 100.0, xtl_starboard_m: 100.0, speed_limit_mps: 3.6, navigation_mode: planned_turn}
    - {id: leg2, from: wp2, to: wp3, planned_cog_deg: 0.0, distance_m: 1300.0, xtl_port_m: 120.0, xtl_starboard_m: 120.0, speed_limit_mps: 8.0, navigation_mode: post_turn_cruise}
    - {id: leg3, from: wp3, to: wp4, planned_cog_deg: 0.0, distance_m: 300.0, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 2.2, navigation_mode: final_approach}
  turn_plan:
    - {at: wp1, inbound_leg: leg0, outbound_leg: leg1, turn_direction: port, turn_radius_m: 700.0, max_rot_deg_s: 0.7, wheel_over_distance_m: 260.0, target_speed_mps: 3.6, parameter_confidence: C}
    - {at: wp2, inbound_leg: leg1, outbound_leg: leg2, turn_direction: starboard, turn_radius_m: 700.0, max_rot_deg_s: 0.7, wheel_over_distance_m: 240.0, target_speed_mps: 3.6, parameter_confidence: C}
  propulsion_policy:
    cruise: {main_propellers: equalized_forward_thrust, tunnel_thrusters: locked_out, rudders: primary_heading_control}
    planned_turning: {main_propellers: allow_limited_differential, tunnel_thrusters: locked_or_derated, rudders: primary_heading_control}
    final_approach_or_hold: {main_propellers: limited_forward_reverse, tunnel_thrusters: available_with_limits, rudders: secondary}
  safety_corridor:
    xte_semantics: XTL exceedance requests safety-supervisor action; it must not directly bypass controller or allocator limits.
    nominal_xte_target_m: 25.0
    max_normal_xte_m: 45.0
    caution_ratio: 0.7
    hold_ratio: 1.0
    abort_ratio: 1.3
    response_sequence: [reduce_speed, rejoin_corridor, hold_or_manual_handover, abort_escape]
  validation_policy:
    require_final_waypoint_reached: true
    require_route_shape_coverage: false
    xte_limit_source: leg_plan
  waypoint_gates:
    - {index: 1, mode: fly_by, switch_radius_m: 80.0, wheel_over_distance_m: 260.0, max_cross_track_m: 45.0, missed_after_distance_m: 100.0, speed_limit_mps: 8.0, lookahead_m: 140.0, rejoin_cross_track_m: 30.0, gate_blocked_speed_mps: 3.2, navigation_mode: cruise}
    - {index: 2, mode: fly_by, switch_radius_m: 70.0, wheel_over_distance_m: 240.0, max_cross_track_m: 90.0, missed_after_distance_m: 100.0, max_switch_speed_mps: 4.4, speed_limit_mps: 3.6, lookahead_m: 130.0, rejoin_cross_track_m: 45.0, gate_blocked_speed_mps: 3.0, navigation_mode: planned_turn}
    - {index: 3, mode: fly_by, switch_radius_m: 70.0, wheel_over_distance_m: 90.0, max_cross_track_m: 100.0, missed_after_distance_m: 100.0, speed_limit_mps: 8.0, lookahead_m: 160.0, rejoin_cross_track_m: 35.0, gate_blocked_speed_mps: 3.5, navigation_mode: post_turn_cruise}
    - {index: 4, mode: final_hold, switch_radius_m: 35.0, speed_limit_mps: 2.2, navigation_mode: final_approach}

environment:
  wind: {speed_mps: 0.0, direction_deg: 0.0}
  current: {speed_mps: 0.0, direction_deg: 0.0}
  wave: {hs_m: 0.0, direction_deg: 0.0}

sensors:
  gnss: {rate_hz: 5, noise_std_m: 0.6}
  imu: {rate_hz: 50, gyro_noise_deg_s: 0.03, accel_noise_mps2: 0.02}
  compass: {rate_hz: 10, noise_std_deg: 0.4}

thrusters:
  count: 7
  failures: []

validation:
  corner_heading_transition_radius_m: 60.0
  heading_min_forward_speed_mps: 1.5
  course_over_ground_min_forward_speed_mps: 1.5

tuning:
  guidance:
    intermediate_capture_radius: 45.0
    intermediate_overrun_radius: 55.0
    max_transit_speed: 8.0
    minimum_steerage_speed: 2.0
    slow_down_dist: 260.0
    final_capture_radius: 45.0
    final_capture_speed: 0.35
    final_handoff_speed: 1.8
    final_capture_max_cross_track_m: 30.0
    final_reacquire_cross_track_m: 25.0
    final_reacquire_min_speed_mps: 1.5
    terminal_decel_use_position_error: true
    final_approach_lookahead_m: 70.0
    final_approach_use_adaptive_los: false
    turn_speed_15deg: 5.0
    turn_speed_45deg: 3.8
    turn_speed_90deg: 3.2
    turn_speed_180deg: 2.5
    turn_slow_down_dist_15deg: 260.0
    turn_slow_down_dist_45deg: 300.0
    turn_slow_down_dist_90deg: 360.0
    turn_slow_down_dist_180deg: 420.0
    heading_cmd_rate_limit_deg_s: 5.0
    homing_threshold_m: 60.0
    homing_max_approach_angle_deg: 14.0
    homing_lookahead_m: 260.0
    turn_recovery_gate_enabled: true
    turn_recovery_require_cruise_mode: true
    turn_recovery_max_xte_m: 35.0
    turn_recovery_max_heading_error_deg: 8.0
    turn_recovery_max_yaw_rate_deg_s: 0.5
    turn_recovery_max_cross_track_rate_mps: 0.30
    turn_recovery_speed_margin_mps: 0.5
    turn_recovery_speed_ramp_mps2: 0.35
    reset_sideslip_on_waypoint_switch: true
    use_adaptive_los: false
    kappa_ilos: 0.0
    delta_min_coeff: 2.2
    gamma_lookahead: 0.25
  thrust_allocation:
    main_equalization_yaw_deadband_kNm: 30.0
    main_equalization_lateral_deadband_kN: 0.5
    side_thruster_derate_start_speed_mps: 2.5
    side_thruster_derate_decay_per_mps: 0.7
    side_thruster_lockout_speed_mps: 4.6
    side_thruster_emergency_unlock_max_speed_mps: 4.6
    side_thruster_lateral_deadband_kN: 0.5
    side_thruster_yaw_emergency_kNm: 220.0
  control:
    coordinate_conventions:
      yaw_torque_sign_cruise: 1.0
      yaw_torque_sign_dp: 1.0
    min_yaw_moment_cruise: 300000.0
    min_yaw_moment_error_deg: 12.0
    max_torque_z: 520000.0
    gains:
      yaw:
        kp: 65000.0
        ki: 0.0
        kd: 650000.0
        k_robust: 300.0
        phi: 0.5
    speed_drag_feedforward:
      linear_N_per_mps: 3500.0
      quadratic_N_per_mps2: 280.0

expected:
  pass_fail_basis: 45m crewboat reduces speed for a planned turn, explicitly clears the post-turn recovery gate, restores cruise speed, reaches final hold, and remains nominal.
  target_speed_mps: 8.0
  min_peak_speed_mps: 7.7
  min_mean_transit_speed_mps: 4.0
  post_turn_recovery_observed: true
  min_post_turn_recovery_peak_speed_mps: 7.0
  max_speed_overshoot_mps: 1.0
  max_arrival_time_s: 850
  arrival_radius_m: 45
  final_waypoint_reached: true
  max_final_position_error_m: 25
  max_final_speed_mps: 0.35
  max_cross_track_error_m: 120
  max_route_plan_xte_excess_m: 0
  max_heading_error_deg: 35
  max_yaw_rate_deg_s: 3
  navigation_fault_detected: false
  should_enter_degraded_mode: false
  should_not_command_hard_turn: true
