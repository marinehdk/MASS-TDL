      - {id: wp4, index: 4, local_xy_m: [4400.0, 75.0], role: planner_internal_shape, coordinate_confidence: C}
      - {id: wp5, index: 5, local_xy_m: [4900.0, 130.0], role: planner_internal_shape, coordinate_confidence: C}
      - {id: wp6, index: 6, local_xy_m: [5400.0, 160.0], role: upper_turn_region, coordinate_confidence: C}
      - {id: wp7, index: 7, local_xy_m: [5900.0, 110.0], role: upper_recovery, coordinate_confidence: C}
      - {id: wp8, index: 8, local_xy_m: [6400.0, -30.0], role: crossover, coordinate_confidence: C}
      - {id: wp9, index: 9, local_xy_m: [6900.0, -130.0], role: lower_turn_entry, coordinate_confidence: C}
      - {id: wp10, index: 10, local_xy_m: [7300.0, -160.0], role: lower_recovery_gate, coordinate_confidence: C}
      - {id: wp11, index: 11, local_xy_m: [7550.0, -150.0], role: final_approach_gate, coordinate_confidence: C}
      - {id: wp12, index: 12, local_xy_m: [7750.0, -100.0], role: final_line_up, coordinate_confidence: C}
      - {id: wp13, index: 13, local_xy_m: [7900.0, -45.0], role: standby_gate, coordinate_confidence: C}
      - {id: wp14, index: 14, local_xy_m: [8050.0, 0.0], role: final_hold, coordinate_confidence: C}
