scenario_id: 002b_long_captain_intent
scenario_class: captain_operational
description: Long-voyage captain-intent route for a 45m crewboat, with a 2.8km calm-water cruise leg, a 4.5km planned S-turn, final approach, standby gate, and final hold point.
validation_objective: Verify that the system can execute a captain-style long route with sparse visible gates, internal planner samples, sustained 8.0 m/s cruise, long-distance S-turn speed reduction, normal XTE target compliance, hard-XTL safety compliance, and final waypoint hold in calm water.
seed: 1202
duration_s: 2200
publish_rate_hz: 10

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace mock route gates and internal planner samples with route-planner/ECDIS/operator inputs; recalibrate values without changing mission, safety, guidance, control, or allocation interfaces.

own_ship:
  initial_pose: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  initial_velocity: {u: 8.0, v: 0.0, r_deg_s: 0.0}
  nominal_speed_mps: 8.0
  # C-level mock planner-internal samples. These are consumed by the current
  # guidance node, while route_plan.captain_visible_gates is the operator-facing
  # passage-plan view.
  waypoints:
    - [0.0, 0.0]
    - [2800.0, 0.0]
    - [3400.0, 0.0]
    - [3900.0, 25.0]
    - [4400.0, 75.0]
    - [4900.0, 130.0]
    - [5400.0, 160.0]
    - [5900.0, 110.0]
    - [6400.0, -30.0]
    - [6900.0, -130.0]
    - [7300.0, -160.0]
    - [7550.0, -150.0]
    - [7750.0, -100.0]
    - [7900.0, -45.0]
    - [8050.0, 0.0]

route_plan:
  schema_version: route_plan.v1
  vessel_profile_ref: crewboat_45m_c_mock
  coordinate_frame: local_enu
  parameter_source: mock_data
  parameter_confidence: C
  route_intent:
    type: long_captain_intent_with_internal_samples
    priority: safety_over_schedule
    completion_policy: reach_final_after_captain_gates_and_corridor_compliance
    description: C-level mock RoutePlan input separating sparse captain-visible gates from dense planner-internal samples.
  captain_intent:
    nominal_cruise_speed_mps: 8.0
    maneuvering_speed_range_mps: [4.5, 5.8]
    final_approach_speed_mps: 1.8
    hold_speed_mps: 0.35
    speed_is_hard_limit: false
    schedule_priority: secondary_to_safety
  speed_recovery_policy:
    enabled: true
    parameter_source: mock_data
    parameter_confidence: C
    description: After a planned low-speed turn, restore cruise speed only when the vessel is back inside the corridor, heading and yaw rate are stable, and the next leg is a cruise leg.
    applies_when_next_navigation_mode: [cruise, open_water_cruise, post_turn_cruise]
    max_xte_m: 35.0
    max_heading_error_deg: 8.0
    max_yaw_rate_deg_s: 0.5
    max_cross_track_rate_mps: 0.30
    speed_ramp_mps2: 0.30
  vessel_profile:
    length_overall_m: 45.0
    propulsion_layout: 3_fixed_main_propellers_2_tunnel_thrusters_2_rudders
    parameter_source: mock_data
    parameter_confidence: C
  visualization:
    hide_internal_waypoint_labels: true
    show_captain_visible_gates: true
  route_execution:
    enabled: true
    mode: turn_aware_smooth_path
    source: waypoint_plan
    sample_spacing_m: 55.0
    tangent_scale: 0.65
    default_wheel_over_distance_m: 300.0
    min_corner_cut_distance_m: 60.0
    max_corner_cut_ratio: 0.82
    min_turn_angle_deg: 1.0
    switch_radius_m: 55.0
    final_switch_radius_m: 35.0
    missed_after_distance_m: 90.0
    lookahead_m: 120.0
    lookahead_m_by_navigation_mode:
      cruise: 145.0
      decel_preparation: 160.0
      long_planned_turn: 120.0
      upper_turn_exit: 125.0
      upper_recovery: 135.0
      counter_turn: 145.0
      lower_turn_entry: 135.0
      lower_recovery: 120.0
      final_line_up: 105.0
      final_approach: 90.0
      standby_approach: 70.0
      final_hold_approach: 55.0
    max_switch_xte_ratio: 1.00
    rejoin_ratio: 0.45
    gate_blocked_speed_ratio: 0.70
    min_gate_blocked_speed_mps: 3.0
    parameter_source: mock_data
    parameter_confidence: C
    note: C-level RouteExecutionPlan generator converts captain-visible route intent and planner shape points into wheel-over rounded controller-facing samples.
  captain_visible_gates:
    - {id: start, role: start, local_xy_m: [0.0, 0.0], required: true, coordinate_confidence: C}
    - {id: cruise_decel_gate, role: planned_speed_reduction_before_turn, local_xy_m: [2800.0, 0.0], required: true, coordinate_confidence: C}
    - {id: s_turn_entry_gate, role: begin_planned_s_turn, local_xy_m: [3400.0, 0.0], required: true, coordinate_confidence: C}
    - {id: upper_turn_region, role: pass_upper_side_of_route, local_xy_m: [5400.0, 160.0], required: true, coordinate_confidence: C}
    - {id: crossover_gate, role: change_to_lower_side, local_xy_m: [6200.0, -30.0], required: true, coordinate_confidence: C}
    - {id: lower_recovery_gate, role: recover_from_lower_side, local_xy_m: [7300.0, -160.0], required: true, coordinate_confidence: C}
    - {id: final_approach_gate, role: line_up_for_final_approach, local_xy_m: [7550.0, -150.0], required: true, coordinate_confidence: C}
    - {id: standby_gate, role: low_speed_standby_before_work_point, local_xy_m: [7900.0, -45.0], required: true, coordinate_confidence: C}
    - {id: final_work_point, role: final_hold_or_work_point, local_xy_m: [8050.0, 0.0], required: true, coordinate_confidence: C}
  waypoint_plan:
