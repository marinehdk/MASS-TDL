      - {id: wp0, index: 0, local_xy_m: [0.0, 0.0], role: start, coordinate_confidence: C}
      - {id: wp1, index: 1, local_xy_m: [2800.0, 0.0], role: cruise_decel_gate, coordinate_confidence: C}
