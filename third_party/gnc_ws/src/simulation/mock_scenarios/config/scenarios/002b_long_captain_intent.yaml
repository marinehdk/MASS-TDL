    - {id: leg0, from: wp0, to: wp1, planned_cog_deg: 0.0, distance_m: 2800.0, xtl_port_m: 25.0, xtl_starboard_m: 25.0, speed_limit_mps: 8.0, navigation_mode: cruise}
    - {id: leg1, from: wp1, to: wp2, planned_cog_deg: 0.0, distance_m: 600.0, xtl_port_m: 25.0, xtl_starboard_m: 25.0, speed_limit_mps: 4.2, navigation_mode: decel_preparation}
