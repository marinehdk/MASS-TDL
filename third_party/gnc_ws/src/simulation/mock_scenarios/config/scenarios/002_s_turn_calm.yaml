scenario_id: 002_s_turn_calm
scenario_class: baseline
description: Calm-water low-curvature S-turn path tracking from the 8.0 m/s 45m crewboat cruise baseline with planned turn-speed reduction.
validation_objective: Verify a route-planner-provided feasible high-speed S-turn, realistic cruise-speed recovery, planned turn entry deceleration, final straight approach, and bounded heading changes without excessive yaw commands in calm water.
seed: 102
duration_s: 820
publish_rate_hz: 10

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace scenario inputs/adapters and recalibrate parameters; do not rewrite mission, safety, guidance, control, or allocation logic.

own_ship:
  initial_pose: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  initial_velocity: {u: 8.0, v: 0.0, r_deg_s: 0.0}
  nominal_speed_mps: 8.0
  # C-level mock route: visible S-turn for a 45m crewboat.
  # The previous +/-15m route was smaller than half a ship length and could be
  # smoothed away by a captain-like LOS lookahead. This route uses a full
  # +80m/-120m S-turn with a recovery leg so the test verifies actual
  # route-shape execution rather than only final waypoint arrival.
  waypoints:
    - [0.0, 0.0]
    - [200.0, 0.0]
    - [350.0, 8.0]
    - [500.0, 32.0]
    - [650.0, 60.0]
    - [800.0, 72.0]
    - [950.0, 80.0]
    - [1100.0, 20.0]
    - [1250.0, -80.0]
    - [1400.0, -120.0]
    - [1550.0, -125.0]
    - [1650.0, -130.0]
    - [1750.0, -110.0]
    - [1800.0, -35.0]
    - [1800.0, 0.0]

route_plan:
  schema_version: route_plan.v1
  vessel_profile_ref: crewboat_45m_c_mock
  coordinate_frame: local_enu
  parameter_source: mock_data
  parameter_confidence: C
  route_intent:
    type: visible_s_turn
    priority: safety_over_schedule
    completion_policy: reach_final_after_corridor_coverage
    description: C-level mock RoutePlan input for testing whether the vessel follows the planned S-turn shape, not only the final waypoint.
  captain_intent:
    nominal_cruise_speed_mps: 8.0
    maneuvering_speed_range_mps: [3.0, 5.0]
    final_approach_speed_mps: 3.0
    hold_speed_mps: 0.35
    speed_is_hard_limit: false
    schedule_priority: secondary_to_safety
  vessel_profile:
    length_overall_m: 45.0
    propulsion_layout: 3_fixed_main_propellers_2_tunnel_thrusters_2_rudders
    parameter_source: mock_data
    parameter_confidence: C
  waypoint_plan:
    points:
      - {id: wp0, index: 0, local_xy_m: [0.0, 0.0], role: start, coordinate_confidence: C}
      - {id: wp1, index: 1, local_xy_m: [200.0, 0.0], role: wheel_over_gate, coordinate_confidence: C}
      - {id: wp2, index: 2, local_xy_m: [350.0, 8.0], role: route_shape, coordinate_confidence: C}
      - {id: wp3, index: 3, local_xy_m: [500.0, 32.0], role: route_shape, coordinate_confidence: C}
      - {id: wp4, index: 4, local_xy_m: [650.0, 60.0], role: route_shape, coordinate_confidence: C}
      - {id: wp5, index: 5, local_xy_m: [800.0, 72.0], role: upper_turn_exit, coordinate_confidence: C}
      - {id: wp6, index: 6, local_xy_m: [950.0, 80.0], role: upper_turn_exit, coordinate_confidence: C}
      - {id: wp7, index: 7, local_xy_m: [1100.0, 20.0], role: crossover, coordinate_confidence: C}
      - {id: wp8, index: 8, local_xy_m: [1250.0, -80.0], role: lower_turn_entry, coordinate_confidence: C}
      - {id: wp9, index: 9, local_xy_m: [1400.0, -120.0], role: lower_turn_exit, coordinate_confidence: C}
      - {id: wp10, index: 10, local_xy_m: [1550.0, -125.0], role: lower_recovery, coordinate_confidence: C}
      - {id: wp11, index: 11, local_xy_m: [1650.0, -130.0], role: final_line_up, coordinate_confidence: C}
      - {id: wp12, index: 12, local_xy_m: [1750.0, -110.0], role: final_approach_gate, coordinate_confidence: C}
      - {id: wp13, index: 13, local_xy_m: [1800.0, -35.0], role: standby_gate, coordinate_confidence: C}
      - {id: wp14, index: 14, local_xy_m: [1800.0, 0.0], role: final_hold, coordinate_confidence: C}
  leg_plan:
    - {id: leg0, from: wp0, to: wp1, planned_cog_deg: 0.0, distance_m: 200.0, xtl_port_m: 20.0, xtl_starboard_m: 20.0, speed_limit_mps: 8.0, navigation_mode: cruise}
    - {id: leg1, from: wp1, to: wp2, planned_cog_deg: 3.05, distance_m: 150.21, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.8, navigation_mode: planned_turn}
    - {id: leg2, from: wp2, to: wp3, planned_cog_deg: 9.09, distance_m: 151.91, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.8, navigation_mode: planned_turn}
    - {id: leg3, from: wp3, to: wp4, planned_cog_deg: 10.57, distance_m: 152.59, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.8, navigation_mode: planned_turn_exit}
    - {id: leg4, from: wp4, to: wp5, planned_cog_deg: 4.57, distance_m: 150.48, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.8, navigation_mode: upper_turn_exit}
    - {id: leg5, from: wp5, to: wp6, planned_cog_deg: 3.05, distance_m: 150.21, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.4, navigation_mode: upper_recovery}
    - {id: leg6, from: wp6, to: wp7, planned_cog_deg: 338.20, distance_m: 161.55, xtl_port_m: 45.0, xtl_starboard_m: 45.0, speed_limit_mps: 3.2, navigation_mode: counter_turn}
    - {id: leg7, from: wp7, to: wp8, planned_cog_deg: 326.31, distance_m: 180.28, xtl_port_m: 45.0, xtl_starboard_m: 45.0, speed_limit_mps: 3.1, navigation_mode: counter_turn}
    - {id: leg8, from: wp8, to: wp9, planned_cog_deg: 345.07, distance_m: 155.24, xtl_port_m: 40.0, xtl_starboard_m: 40.0, speed_limit_mps: 3.2, navigation_mode: lower_recovery}
    - {id: leg9, from: wp9, to: wp10, planned_cog_deg: 358.09, distance_m: 150.08, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 3.2, navigation_mode: lower_recovery}
    - {id: leg10, from: wp10, to: wp11, planned_cog_deg: 357.14, distance_m: 100.12, xtl_port_m: 35.0, xtl_starboard_m: 35.0, speed_limit_mps: 2.6, navigation_mode: line_up}
    - {id: leg11, from: wp11, to: wp12, planned_cog_deg: 11.31, distance_m: 101.98, xtl_port_m: 30.0, xtl_starboard_m: 30.0, speed_limit_mps: 2.4, navigation_mode: final_approach}
    - {id: leg12, from: wp12, to: wp13, planned_cog_deg: 56.31, distance_m: 90.14, xtl_port_m: 25.0, xtl_starboard_m: 25.0, speed_limit_mps: 1.8, navigation_mode: standby_approach}
    - {id: leg13, from: wp13, to: wp14, planned_cog_deg: 90.0, distance_m: 35.0, xtl_port_m: 25.0, xtl_starboard_m: 25.0, speed_limit_mps: 0.8, navigation_mode: final_hold_approach}
  turn_plan:
    - {at: wp1, inbound_leg: leg0, outbound_leg: leg1, turn_direction: port, turn_radius_m: 260.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 160.0, target_speed_mps: 3.8, parameter_confidence: C}
    - {at: wp2, inbound_leg: leg1, outbound_leg: leg2, turn_direction: port, turn_radius_m: 260.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 45.0, target_speed_mps: 3.8, parameter_confidence: C}
    - {at: wp4, inbound_leg: leg3, outbound_leg: leg4, turn_direction: starboard, turn_radius_m: 260.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 35.0, target_speed_mps: 3.8, parameter_confidence: C}
    - {at: wp5, inbound_leg: leg4, outbound_leg: leg5, turn_direction: starboard, turn_radius_m: 260.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 45.0, target_speed_mps: 3.4, parameter_confidence: C}
    - {at: wp6, inbound_leg: leg5, outbound_leg: leg6, turn_direction: starboard, turn_radius_m: 260.0, max_rot_deg_s: 1.2, wheel_over_distance_m: 100.0, target_speed_mps: 3.2, parameter_confidence: C}
    - {at: wp7, inbound_leg: leg6, outbound_leg: leg7, turn_direction: starboard, turn_radius_m: 260.0, max_rot_deg_s: 1.2, wheel_over_distance_m: 70.0, target_speed_mps: 3.1, parameter_confidence: C}
    - {at: wp8, inbound_leg: leg7, outbound_leg: leg8, turn_direction: port, turn_radius_m: 240.0, max_rot_deg_s: 1.2, wheel_over_distance_m: 80.0, target_speed_mps: 3.2, parameter_confidence: C}
    - {at: wp9, inbound_leg: leg8, outbound_leg: leg9, turn_direction: port, turn_radius_m: 220.0, max_rot_deg_s: 1.2, wheel_over_distance_m: 100.0, target_speed_mps: 3.2, parameter_confidence: C}
    - {at: wp10, inbound_leg: leg9, outbound_leg: leg10, turn_direction: starboard, turn_radius_m: 220.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 60.0, target_speed_mps: 2.6, parameter_confidence: C}
    - {at: wp11, inbound_leg: leg10, outbound_leg: leg11, turn_direction: port, turn_radius_m: 180.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 60.0, target_speed_mps: 2.4, parameter_confidence: C}
    - {at: wp12, inbound_leg: leg11, outbound_leg: leg12, turn_direction: port, turn_radius_m: 120.0, max_rot_deg_s: 1.0, wheel_over_distance_m: 70.0, target_speed_mps: 1.8, parameter_confidence: C}
    - {at: wp13, inbound_leg: leg12, outbound_leg: leg13, turn_direction: port, turn_radius_m: 80.0, max_rot_deg_s: 0.8, wheel_over_distance_m: 35.0, target_speed_mps: 0.8, parameter_confidence: C}
  propulsion_policy:
    cruise: {main_propellers: equalized_forward_thrust, tunnel_thrusters: locked_out, rudders: primary_heading_control}
    planned_turning: {main_propellers: allow_limited_differential, tunnel_thrusters: locked_or_derated, rudders: primary_heading_control}
    final_approach_or_hold: {main_propellers: limited_forward_reverse, tunnel_thrusters: available_with_limits, rudders: secondary}
  safety_corridor:
    xte_semantics: XTL exceedance requests safety-supervisor action; it must not directly bypass controller or allocator limits.
    caution_ratio: 0.7
    hold_ratio: 1.0
    abort_ratio: 1.3
    response_sequence: [reduce_speed, rejoin_corridor, hold_or_manual_handover, abort_escape]
  validation_policy:
    require_final_waypoint_reached: true
    require_route_shape_coverage: true
    xte_limit_source: leg_plan
    min_route_side_coverage_ratio: 0.55
    max_route_intent_lateral_gap_m: 25.0
  compatibility_layer:
    status: active
    note: Current guidance still consumes own_ship.waypoints and waypoint_gates; RoutePlan adapter is the next implementation step.
  # C-level mock route-planning semantics for a 45m crewboat.
  # These are not measured vessel-specific wheel-over values yet; real sea-trial
  # data should recalibrate them without changing the guidance interface.
  waypoint_gates:
    # C-level mock wheel-over distance: the route-intent retest showed that a
    # 60m fly-by combined with a 200m LOS lookahead lets the vessel cut across
    # the shallow S-turn. These gates keep fly-by behavior, but require the
    # vessel to enter the intended route corridor before handing off.
    # C-level mock route speed limits: 8m/s remains the straight/open-water
    # validation baseline. The mild entry S-turn corridor is planned at 6m/s.
    # The counter-turn recovery and final line-up are slowed and gated because
    # the current mock vessel cannot safely recapture the line at 5-6m/s without
    # exceeding the 25m corridor.
    # This mirrors a captain holding maneuvering speed through the turn exit
    # instead of accelerating immediately after the last curvature reversal.
    - {index: 1, mode: fly_by, switch_radius_m: 80.0, wheel_over_distance_m: 160.0, max_cross_track_m: 35.0, missed_after_distance_m: 50.0, speed_limit_mps: 3.8, lookahead_m: 60.0, rejoin_cross_track_m: 25.0, gate_blocked_speed_mps: 3.0}
    - {index: 2, mode: fly_by, switch_radius_m: 45.0, wheel_over_distance_m: 45.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, speed_limit_mps: 3.8, lookahead_m: 70.0, rejoin_cross_track_m: 28.0, gate_blocked_speed_mps: 3.0}
    - {index: 3, mode: fly_by, switch_radius_m: 45.0, wheel_over_distance_m: 45.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, speed_limit_mps: 3.8, lookahead_m: 70.0, rejoin_cross_track_m: 28.0, gate_blocked_speed_mps: 3.0}
    - {index: 4, mode: fly_by, switch_radius_m: 45.0, wheel_over_distance_m: 35.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, speed_limit_mps: 3.8, lookahead_m: 70.0, rejoin_cross_track_m: 28.0, gate_blocked_speed_mps: 3.0}
    - {index: 5, mode: fly_by, switch_radius_m: 50.0, wheel_over_distance_m: 45.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, speed_limit_mps: 3.4, lookahead_m: 70.0, rejoin_cross_track_m: 25.0, gate_blocked_speed_mps: 2.4}
    - {index: 6, mode: fly_by, switch_radius_m: 55.0, wheel_over_distance_m: 100.0, max_cross_track_m: 45.0, missed_after_distance_m: 55.0, speed_limit_mps: 3.2, lookahead_m: 80.0, rejoin_cross_track_m: 30.0, gate_blocked_speed_mps: 2.4}
    - {index: 7, mode: fly_by, switch_radius_m: 50.0, wheel_over_distance_m: 70.0, max_cross_track_m: 45.0, missed_after_distance_m: 55.0, max_switch_speed_mps: 3.4, speed_limit_mps: 3.1, lookahead_m: 85.0, rejoin_cross_track_m: 30.0, gate_blocked_speed_mps: 2.5}
    - {index: 8, mode: fly_by, switch_radius_m: 50.0, wheel_over_distance_m: 80.0, max_cross_track_m: 40.0, missed_after_distance_m: 55.0, max_switch_speed_mps: 3.4, speed_limit_mps: 3.2, lookahead_m: 85.0, rejoin_cross_track_m: 26.0, gate_blocked_speed_mps: 2.6}
    - {index: 9, mode: fly_by, switch_radius_m: 50.0, wheel_over_distance_m: 100.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, max_switch_speed_mps: 3.4, speed_limit_mps: 3.2, lookahead_m: 80.0, rejoin_cross_track_m: 24.0, gate_blocked_speed_mps: 2.6}
    # C-level mock final approach gate: do not turn onto the final straight
    # until heading and speed are already in a captain-like line-up envelope.
    - {index: 10, mode: fly_by, switch_radius_m: 50.0, wheel_over_distance_m: 60.0, max_cross_track_m: 35.0, missed_after_distance_m: 55.0, max_switch_speed_mps: 3.0, speed_limit_mps: 2.6, lookahead_m: 70.0, rejoin_cross_track_m: 25.0, gate_blocked_speed_mps: 1.8}
    - {index: 11, mode: fly_by, switch_radius_m: 45.0, wheel_over_distance_m: 60.0, max_cross_track_m: 30.0, missed_after_distance_m: 50.0, max_switch_speed_mps: 2.8, speed_limit_mps: 2.4, lookahead_m: 65.0, rejoin_cross_track_m: 22.0, gate_blocked_speed_mps: 1.5}
    - {index: 12, mode: fly_by, switch_radius_m: 45.0, wheel_over_distance_m: 70.0, max_cross_track_m: 30.0, missed_after_distance_m: 50.0, max_switch_speed_mps: 2.4, speed_limit_mps: 1.8, lookahead_m: 55.0, rejoin_cross_track_m: 20.0, gate_blocked_speed_mps: 1.2}
    - {index: 13, mode: fly_by, switch_radius_m: 35.0, wheel_over_distance_m: 35.0, max_cross_track_m: 25.0, missed_after_distance_m: 35.0, max_heading_error_deg: 25.0, max_switch_speed_mps: 2.5, speed_limit_mps: 0.8, lookahead_m: 35.0, rejoin_cross_track_m: 15.0, gate_blocked_speed_mps: 0.8}
    - {index: 14, mode: final_hold, switch_radius_m: 25.0}

speed_validation_plan:
  inherited_baseline:
    scenario_id: 001_straight_calm
    speed_mps: 8.0
    purpose: Preserve the 45m crewboat straight-line cruise baseline before every 002 regression run.
  current_level:
    id: V3_turning
    cruise_speed_mps: 8.0
    planned_turn_speed_mps: 3.8
    planned_counter_turn_recovery_speed_mps: 3.2
    planned_turn_exit_speed_mps: 0.8
    terminal_capture_speed_mps: 1.2
    purpose: Keep realistic transit speed on smooth route legs while reducing speed before sustained S-turn curvature and final approach.
  reference_levels:
    - {id: V1, speed_mps: 3.0, purpose: Conservative sign-convention baseline}
    - {id: V2, speed_mps: 5.0, purpose: Medium-speed S-turn handling}

environment:
  wind: {speed_mps: 0.0, direction_deg: 0.0}
  current: {speed_mps: 0.0, direction_deg: 0.0}
  wave: {hs_m: 0.0, direction_deg: 0.0}

sensors:
  gnss: {rate_hz: 5, noise_std_m: 0.6}
  imu: {rate_hz: 50, gyro_noise_deg_s: 0.03, accel_noise_mps2: 0.02}
  compass: {rate_hz: 10, noise_std_deg: 0.4}

thrusters:
  count: 7
  failures: []

validation:
  corner_heading_transition_radius_m: 50.0
  # C-level mock validation threshold: below this speed the vessel is in terminal
  # slow-speed capture/holding, so route heading is assessed by final pose metrics.
  heading_min_forward_speed_mps: 1.5
  course_over_ground_min_forward_speed_mps: 1.5

tuning:
  guidance:
    # C-level mock captain-like speed profile for a 45m crewboat:
    # 8 m/s is the open-water cruise target. Very small course changes are
    # held near cruise speed; moderate turns are reduced, but not to artificial
    # crawl speeds just to satisfy the test.
    intermediate_capture_radius: 30.0
    intermediate_overrun_radius: 35.0
    max_transit_speed: 8.0
    minimum_steerage_speed: 2.0
    # C-level mock terminal deceleration point. The S-turn has only a short
    # final leg, so the captain-style slowdown must start by remaining route
    # distance, not only by distance to the last waypoint.
    slow_down_dist: 520.0
    final_capture_radius: 60.0
    final_capture_speed: 0.35
    final_handoff_speed: 2.3
    # C-level mock captain-like terminal rule: do not hand over to low-speed
    # final hold until the vessel is both close to the endpoint and laterally
    # aligned; if the final leg is not captured, keep enough speed for rudder
    # authority instead of letting terminal deceleration freeze the vessel.
    final_capture_max_cross_track_m: 45.0
    final_reacquire_cross_track_m: 35.0
    final_reacquire_min_speed_mps: 1.2
    terminal_decel_use_position_error: true
    final_approach_lookahead_m: 70.0
    final_approach_use_adaptive_los: false
    turn_no_slowdown_angle_deg: 5.0
    turn_speed_15deg: 3.8
    turn_speed_45deg: 4.2
    turn_speed_90deg: 3.6
    turn_speed_180deg: 2.4
    turn_slow_down_dist_15deg: 360.0
    turn_slow_down_dist_45deg: 240.0
    turn_slow_down_dist_90deg: 340.0
    turn_slow_down_dist_180deg: 440.0
    # C-level mock captain-like constraint: heading commands are ramped instead
    # of stepped, but the command-rate limit must still allow a planned
    # counter-turn. This is not rudder angle rate; it is the guidance heading
    # order slew limit.
    heading_cmd_rate_limit_deg_s: 6.0
    # C-level mock observer policy: the ALOS sideslip estimate is path-frame
    # state, so it is reset when the route planner hands off to a new leg.
    # This prevents S-turn curvature history from biasing the final straight.
    reset_sideslip_on_waypoint_switch: true
    # C-level mock calm-water S-turn policy: do not let the ALOS sideslip
    # observer or ILOS integral remember curvature-induced cross-track error as
    # if it were steady wind/current. External-load scenarios should re-enable
    # these terms with calibrated anti-windup after the calm baseline is locked.
    use_adaptive_los: false
    kappa_ilos: 0.0
    delta_min_coeff: 2.0
    gamma_lookahead: 0.25
  thrust_allocation:
    # C-level mock policy aligned with 001: main propellers carry cruise surge;
    # tunnel thrusters are derated from low speed, locked out at cruise speed,
    # and can only emergency-unlock below the configured speed ceiling.
    main_equalization_yaw_deadband_kNm: 30.0
    main_equalization_lateral_deadband_kN: 0.5
    side_thruster_derate_start_speed_mps: 2.0
    side_thruster_derate_decay_per_mps: 0.7
    side_thruster_lockout_speed_mps: 4.0
    side_thruster_emergency_unlock_max_speed_mps: 4.0
    side_thruster_lateral_deadband_kN: 0.5
    side_thruster_yaw_emergency_kNm: 220.0
  control:
    coordinate_conventions:
      # C-level mock sign setting for the current dynamics/allocation chain.
      # The S-turn retest showed that the earlier 140 kNm yaw floor was too weak
      # to prove the sign convention. Re-test the baseline convention after
      # raising the planned-turn yaw authority.
      yaw_torque_sign_cruise: 1.0
      yaw_torque_sign_dp: 1.0
    min_yaw_moment_cruise: 300000.0
    min_yaw_moment_error_deg: 12.0
    max_torque_z: 520000.0
    gains:
      yaw:
        kp: 65000.0
        ki: 0.0
        kd: 650000.0
        k_robust: 300.0
        phi: 0.5
    speed_drag_feedforward:
      linear_N_per_mps: 3500.0
      quadratic_N_per_mps2: 280.0

expected:
  pass_fail_basis: 45m crewboat tracks an S-turn route from the V3 8.0 m/s cruise baseline, slows before turns, reaches the final waypoint, and remains nominal.
  target_speed_mps: 8.0
  min_peak_speed_mps: 7.7
  # C-level mock acceptance: the visible S-turn deliberately trades
  # some schedule for route-shape fidelity. This is still maneuvering speed,
  # not an artificial crawl-speed pass.
  min_mean_transit_speed_mps: 2.8
  max_speed_overshoot_mps: 1.0
  max_arrival_time_s: 700
  arrival_radius_m: 45
  final_waypoint_reached: true
  max_final_position_error_m: 25
  max_final_speed_mps: 0.35
  # C-level mock global envelope. Segment-specific RoutePlan limits are checked
  # separately by max_route_plan_xte_excess_m, so planned 45m counter-turn
  # recovery is not misread as a global route failure.
  max_cross_track_error_m: 45
  max_route_plan_xte_excess_m: 0
  # C-level mock route-intent checks: a valid S-turn must cover both sides of
