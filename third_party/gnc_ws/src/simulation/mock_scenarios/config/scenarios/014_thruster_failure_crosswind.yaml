scenario_id: 014_thruster_failure_crosswind
scenario_class: actuator_fault
description: Bow thruster failure during crosswind tracking.
validation_objective: Verify actuator fault degradation, reallocation, and captain alert behavior.
seed: 114
duration_s: 620
publish_rate_hz: 10

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace scenario inputs/adapters and recalibrate parameters; do not rewrite mission, safety, guidance, control, or allocation logic.

own_ship:
  initial_pose: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  initial_velocity: {u: 2.5, v: 0.0, r_deg_s: 0.0}
  nominal_speed_mps: 2.5
  waypoints:
    - [0.0, 0.0]
    - [250.0, 0.0]
    - [500.0, 30.0]
    - [750.0, 30.0]

environment:
  wind: {speed_mps: 9.0, direction_deg: 90.0, anemometer_height_m: 10.0}
  current: {speed_mps: 0.4, direction_deg: 90.0, tide_speed_mps: 0.4, tide_direction_deg: 90.0}
  wave: {hs_m: 0.4, direction_deg: 90.0}

sensors:
  gnss: {rate_hz: 5, noise_std_m: 0.8}
  imu: {rate_hz: 50, gyro_noise_deg_s: 0.03, accel_noise_mps2: 0.03}
  compass: {rate_hz: 10, noise_std_deg: 0.5}

thrusters:
  count: 7
  failures:
    - {index: 5, start_s: 220, duration_s: 260, health: 0.0}

expected:
  pass_fail_basis: Fault is detected, allocation degrades gracefully, and lateral error remains within emergency margin.
  max_cross_track_error_m: 45
  max_heading_error_deg: 18
  max_yaw_rate_deg_s: 8
  actuator_fault_detected: true
  should_enter_degraded_mode: true
  should_alert_captain: true
