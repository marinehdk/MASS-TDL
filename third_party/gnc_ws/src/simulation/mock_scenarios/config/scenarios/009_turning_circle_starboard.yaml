scenario_id: 009_turning_circle_starboard
scenario_class: standard_manoeuvre
description: Starboard turning-circle style route for yaw response and tactical-diameter screening.
validation_objective: Verify yaw response, bounded speed loss, and no allocator saturation during a large planned turn.
seed: 109
duration_s: 720
publish_rate_hz: 10

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace scenario inputs/adapters and recalibrate parameters; do not rewrite mission, safety, guidance, control, or allocation logic.

own_ship:
  initial_pose: {x: 0.0, y: 0.0, yaw_deg: 0.0}
  initial_velocity: {u: 3.0, v: 0.0, r_deg_s: 0.0}
  nominal_speed_mps: 3.0
  waypoints:
    - [0.0, 0.0]
    - [250.0, 0.0]
    - [430.0, -90.0]
    - [500.0, -260.0]
    - [420.0, -430.0]
    - [250.0, -520.0]
    - [50.0, -500.0]

environment:
  wind: {speed_mps: 2.0, direction_deg: 30.0}
  current: {speed_mps: 0.1, direction_deg: 120.0}
  wave: {hs_m: 0.2, direction_deg: 45.0}

sensors:
  gnss: {rate_hz: 5, noise_std_m: 0.6}
  imu: {rate_hz: 50, gyro_noise_deg_s: 0.03, accel_noise_mps2: 0.02}
  compass: {rate_hz: 10, noise_std_deg: 0.4}

thrusters:
  count: 7
  failures: []

expected:
  pass_fail_basis: Turn completes without long yaw saturation or unsafe speed loss.
  max_cross_track_error_m: 45
  max_heading_error_deg: 18
  max_yaw_rate_deg_s: 8
  min_forward_speed_mps: 1.2
  max_yaw_saturation_duration_s: 25
