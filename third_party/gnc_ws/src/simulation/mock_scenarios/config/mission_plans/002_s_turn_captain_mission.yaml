mission_plan_id: 002_s_turn_captain_mission
schema_version: mission_plan.v1
scenario_ref: 002_s_turn_calm
vessel_profile_ref: crewboat_45m_c_mock
coordinate_frame: local_enu

data_policy:
  parameter_source: mock_data
  parameter_confidence: C
  real_data_transition: Replace mock coordinates, gates, and clearances with ECDIS/route-planner/operator inputs; do not rewrite execution logic.

captain_intent:
  priority: safety_over_schedule
  route_style: visible_s_turn_with_terminal_standby
  nominal_cruise_speed_mps: 8.0
  maneuvering_speed_range_mps: [3.0, 5.0]
  final_approach_speed_mps: 1.8
  standby_speed_mps: 0.8
  hold_speed_mps: 0.35
  speed_is_hard_limit: false
  notes:
    - 8m/s is the calm-water straight cruise target, not a hard requirement through turns or approach.
    - The captain-visible plan uses key gates only; dense control samples are generated by the route planner.

mission_phases:
  - id: precheck
    next: cruise
    exit_gate:
      navigation_ok: true
      propulsion_available: true
      route_plan_confirmed: true
  - id: cruise
    active_until: s_turn_entry_gate
    speed_limit_mps: 8.0
  - id: planned_s_turn
    active_from: s_turn_entry_gate
    active_until: lower_recovery_gate
    speed_limit_mps: 3.8
  - id: approach
    active_from: final_approach_gate
    active_until: standby_gate
    speed_limit_mps: 1.8
  - id: standby
    active_from: standby_gate
    active_until: final_work_point
    speed_limit_mps: 0.8
  - id: complete
    active_from: final_work_point

captain_visible_gates:
  - {id: start, role: start, local_xy_m: [0.0, 0.0], required: true, coordinate_confidence: C}
  - {id: s_turn_entry_gate, role: begin_planned_s_turn, local_xy_m: [200.0, 0.0], required: true, coordinate_confidence: C}
  - {id: upper_turn_region, role: pass_upper_side_of_route, local_xy_m: [850.0, 75.0], required: true, coordinate_confidence: C}
  - {id: crossover_gate, role: change_to_lower_side, local_xy_m: [1120.0, 10.0], required: true, coordinate_confidence: C}
  - {id: lower_recovery_gate, role: recover_from_lower_side, local_xy_m: [1500.0, -125.0], required: true, coordinate_confidence: C}
  - {id: final_approach_gate, role: line_up_for_final_approach, local_xy_m: [1650.0, -130.0], required: true, coordinate_confidence: C}
  - {id: standby_gate, role: low_speed_standby_before_work_point, local_xy_m: [1800.0, -35.0], required: true, coordinate_confidence: C}
  - {id: final_work_point, role: final_hold_or_work_point, local_xy_m: [1800.0, 0.0], required: true, coordinate_confidence: C}

captain_gate_conditions:
  s_turn_entry_gate:
    max_cross_track_m: 35.0
    max_speed_mps: 3.8
    wheel_over_required: true
  lower_recovery_gate:
    max_cross_track_m: 35.0
    max_speed_mps: 3.2
  final_approach_gate:
    max_cross_track_m: 22.0
    max_speed_mps: 2.4
  standby_gate:
    max_cross_track_m: 15.0
    max_speed_mps: 1.5
  final_work_point:
    max_position_error_m: 25.0
    max_speed_mps: 0.35

safety_intent:
  xte_policy: reduce_speed_rejoin_then_hold_or_abort
  abort_route_required: true
  human_confirmation_required:
    - approach_to_standby
    - standby_to_final_work_point
  safety_supervisor_can_interrupt: true
