# behavior-fix stack isolation from main mass-l3-sil stack.
# Main stack (mass-l3-sil) uses host network + ROS_DOMAIN_ID=42 + ports
# 18000(orchestrator)/18765(foxglove). To run behavior-fix stack concurrently
# without DDS or port conflicts, override:
#   - ROS_DOMAIN_ID -> 43 (DDS discovery isolation)
#   - orchestrator port -> 18001
#   - foxglove port -> 18766
# Both stacks stay on host network (base compose requires it); DDS domain
# separation prevents node/topic cross-talk.
#
# Usage:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.a4000.yml:docker-compose.plugins.yml:docker-compose.behavior-fix-isolation.yml \
#   COMPOSE_PROJECT_NAME=colregs-behavior-fix docker compose up -d
services:
  sil-orchestrator:
    command:
      - /bin/bash
      - -c
      - "source /opt/ros/humble/setup.bash && source /opt/sil/install/setup.bash && python3 -m uvicorn sil_orchestrator.main:app --host 0.0.0.0 --port 18001 --ssl-certfile /certs/sil.crt --ssl-keyfile /certs/sil.key"
    environment:
      - ROS_DOMAIN_ID=43
      - FOX_PORT=18766

  sil-nodes:
    environment:
      - ROS_DOMAIN_ID=43
      - SIL_L4_ADAPTER_ENABLE=1
      - SIL_BRIDGE_RELEASE_FALLBACK=0

  foxglove-bridge:
    command:
      - bash
      - -c
      - |
        source /opt/ros/humble/setup.bash &&
        source /opt/ws/install/setup.bash &&
        ros2 run foxglove_bridge foxglove_bridge \
          --ros-args \
          -p port:=18766 \
          -p num_threads:=4 \
          -p send_buffer_limit:=10000000 \
          -p use_sim_time:=true \
          -p certfile:=/certs/sil.crt \
          -p keyfile:=/certs/sil.key \
          -p topic_whitelist:="[/sim_clock,/sil/own_ship_state,/sil/target_vessel_state,/sil/radar_meas,/sil/ais_msg,/sil/environment,/sil/tracked_targets,/sil/lifecycle_status,/sil/module_pulse,/sil/scoring,/sil/asdr_event,/sil/sat2_data,/sil/sat3_data,/sil/sotif_metrics,/l3/fsm_state,/l3/m1/odd_state,/l3/m2/world_state,/l3/m4/behavior_plan,/l3/m5/avoidance_plan,/l3/m6/colregs_constraint,/l3/m7/safety_alert,/l2/planned_route,/fusion/tracked_targets]"
    environment:
      - ROS_DOMAIN_ID=43
