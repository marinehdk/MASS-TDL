Evidence duty: prove workspace identity; reconstruct current code/contracts/tests/traces; separate project fact, documented intent, domain evidence, decision, assumption, contradiction, and unknown. Use the approved NLM route when authorized: nlm-ask, then fast research, at most one justified sequential deep job, then official web fallback. Compare credible options and map requirements to falsifiable verification.

Preserve M1 authority, M5/M6/M7 boundaries, M8 operator-interface ownership, L4 executability as an independent GNC review concern, ROS2 contract fields, vessel-agnostic decision-core logic, and full encounter lifecycle semantics.

Completion contract: report classification, current system, requirements, constraints, contracts/lifecycle, options, recommendation, verification, gaps, ranked questions for the primary agent, readiness recommendation, commands/evidence used, remaining risks, and workspace writes (must be none).
"""
