name: mass-l3-sil

# NOTE: dev services are run natively on the host to avoid port conflicts.

services:
  sil-orchestrator:
    build:
      context: .
      dockerfile: docker/sil_orchestrator.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./scenarios:/var/sil/scenarios
      - ./runs:/var/sil/runs
      - ./exports:/var/sil/exports
      - ./certs:/certs:ro
      - ./src/sil_orchestrator:/opt/sil/sil_orchestrator
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    network_mode: host

  sil-nodes:
    build:
      context: .
      dockerfile: docker/sil_nodes.Dockerfile
    volumes:
      - ./scenarios:/var/sil/scenarios
      - ./runs:/var/sil/runs
      - ./src:/opt/ws/src
      - ./docker:/opt/ws/docker
      - ./docker/sil_entrypoint.sh:/opt/ws/sil_entrypoint.sh:ro
    command: /opt/ws/sil_entrypoint.sh
    environment:
      - SIL_RUN_DIR=/var/sil/runs
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - SIL_L3_ENABLE=1               # Set 0 to bypass L3 kernel (sim-only mode)
      - SIL_L4_ADAPTER_ENABLE=1       # L4 adapter owns /sil/actuator_cmd; set 0 for legacy bridge actuator
      - SIL_BRIDGE_RELEASE_FALLBACK=0 # Legacy bridge latch release; keep off for module-owned handback
      - TDL_INTEGRATION_PROFILE=${TDL_INTEGRATION_PROFILE:-default}
    network_mode: host

  foxglove-bridge:
    build:
      context: .
      dockerfile: docker/sil_nodes.Dockerfile
    volumes:
      - ./certs:/certs:ro
    command: |
      bash -c '
        source /opt/ros/humble/setup.bash &&
        source /opt/ws/install/setup.bash &&
        ros2 run foxglove_bridge foxglove_bridge \
          --ros-args \
          -p port:=8765 \
          -p num_threads:=4 \
          -p send_buffer_limit:=10000000 \
          -p use_sim_time:=true \
          -p certfile:=/certs/sil.crt \
          -p keyfile:=/certs/sil.key \
          -p topic_whitelist:="[/sim_clock,/sil/own_ship_state,/sil/target_vessel_state,/sil/radar_meas,/sil/ais_msg,/sil/environment,/sil/tracked_targets,/sil/lifecycle_status,/sil/module_pulse,/sil/scoring,/sil/asdr_event,/sil/sat2_data,/sil/sat3_data,/sil/sotif_metrics,/l3/fsm_state,/l3/m1/odd_state,/l3/m2/world_state,/l3/m4/behavior_plan,/l3/m5/avoidance_plan,/l3/m6/colregs_constraint,/l3/m7/safety_alert,/l3/m8/threat_state,/l2/planned_route,/fusion/tracked_targets]"
      '
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    network_mode: host
    restart: unless-stopped
    depends_on:
      - sil-nodes

  martin-tile-server:
    image: ghcr.io/maplibre/martin:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ${MASS_L3_TILE_DIR:-./data/tiles}:/data/tiles
    command: ["/data/tiles"]
    network_mode: host
