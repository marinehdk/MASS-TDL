coordinate_transform_node:
  ros__parameters:
    earth_semi_major_axis: 6378137.0
    earth_first_eccentricity_sq: 0.00669437999014
    # 与航线规划日志保持一致：规划端使用 pyproj.Geod.inv(origin, point) 得到距离和方位角，
    # 再换算 x_north=cos(az)*dist、y_east=sin(az)*dist。长航线不要使用局部线性近似。
    projection_mode: "geod_inverse"
    planner_meters_per_degree: 111320.0
    input_topic: "/gnc/active_route"
    output_topic: "/ship/waypoints"
    origin_topic: "/route_planning/origin_latlon"
    # 路径平滑参数
    enable_arc_smoothing: false
    arc_radius_m: 700.0
    shallow_arc_radius_m: 700.0
    shallow_arc_angle_deg: 35.0
    arc_sample_spacing_m: 80.0
    min_turn_angle_deg: 15.0
    arc_speed_mps: 5.0
    arc_smoothing_external_route_min_points: 40
    arc_smoothing_max_lateral_delta_m: 120.0
    # 弧前预减速距离
    pre_arc_decel_dist_m: 180.0
    enable_route_update_guard: true
    min_route_update_interval_s: 2.0
    min_future_update_distance_m: 500.0
    max_dynamic_lateral_delta_m: 100.0
    emergency_avoidance_relax_update_guard: true
    emergency_avoidance_min_future_update_distance_m: 0.0
    emergency_avoidance_max_dynamic_lateral_delta_m: 1500.0

    # 终点进场参数
    enable_fap: false
    fap_distance_m: 120.0
    fap_speed_mps: 1.0
    reject_reverse_segments: true
    roll_limit_deg: 10.0
    feedback_log_enabled: true          # write /ship/geo_position diagnostics to CSV
    feedback_log_dir: "/home/lee.li/workspace/ship_sim_ws_tiger_change_528/ship_feedback_logs"
    feedback_log_period_s: 0.5          # 2Hz, enough for speed/heading/XTE analysis
    xte_reference_mismatch_warn_m: 80.0
