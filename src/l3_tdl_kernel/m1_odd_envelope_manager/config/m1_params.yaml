# M1 ODD/Envelope Manager parameters
# All [TBD-HAZID] values: FCB initial baselines, to be calibrated in HAZID Phase 2

state_machine:
  in_to_edge: 0.8                  # [TBD-HAZID] score threshold for IN->EDGE
  edge_to_out: 0.5                 # [TBD-HAZID] score threshold for EDGE->OUT
  stale_degradation_factor: 0.5    # [TBD-HAZID] score multiplier when inputs stale

conformance_score:
  weights:
    w_e: 0.4             # [TBD-HAZID] environment weight
    w_t: 0.3             # [TBD-HAZID] task weight
    w_h: 0.3             # [TBD-HAZID] human weight
  e_score:
    visibility_full_nm: 2.0        # visibility >= this -> ODD-A (full)
    visibility_degraded_nm: 1.0    # visibility >= this -> ODD-B (degraded)
    visibility_marginal_nm: 0.5    # visibility >= this -> ODD-D (marginal, OR)
    sea_state_full_hs: 2.5         # Hs <= this -> ODD-A (full)
    sea_state_degraded_hs: 3.0     # Hs <= this -> ODD-B (degraded)
    sea_state_marginal_hs: 4.0     # Hs <= this -> ODD-D (marginal, OR)

t_score:
  comm_delay_ok_s: 2.0     # [TBD-HAZID] comm RTT threshold for "ok" classification [s]
  comm_ok: 0.6             # [TBD-HAZID] T-score when sensor degraded but comm within limit
  comm_bad: 0.3            # [TBD-HAZID] T-score when comm late or critical sensor failure

h_score:
  available: 1.0           # [TBD-HAZID] H-score when TMR available and comm OK
  unavailable: 0.5         # [TBD-HAZID] H-score when TMR not available

tmr_tdl:
  tmr_baseline_s: 60.0    # [TBD-HAZID] Veitch 2024 baseline [s]
  tcpa_coefficient: 0.6   # [TBD-HAZID] TCPA * coefficient for TDL component
  tmr_min_s: 30.0         # minimum TMR clamp [s]
  tmr_max_s: 600.0        # maximum TMR clamp [s]
  # D-DEMO1-R11: tdl_min_s raised from 0.0 → 35.0 to prevent MRC_PREP during active avoidance.
  # In head-on imazu-01-ho, TCPA≈0.2s → TDL=TCPA×0.6≈0.12s << TMR=30s, triggering forced
  # MRC_PREP via on_main_loop_tick() ToR logic. Setting tdl_min_s=35s ensures TDL≥35>TMR=30s
  # so M1 can remain in ENVELOPE_IN during the avoidance manoeuvre.
  # [TBD-HAZID]: re-calibrate from real AIS/TCPA distributions in Phase 2 HAZID.
  tdl_min_s: 35.0         # minimum TDL clamp [s] — raised for DEMO-1 avoidance window
  tdl_max_s: 600.0        # maximum TDL clamp [s]

mrc:
  max_anchor_depth_m: 50.0           # [TBD-HAZID] maximum water depth for anchoring [m]
  max_heave_to_sea_state_hs: 4.0     # [TBD-HAZID] maximum Hs for heave-to [m]
  max_heave_to_wind_kn: 40.0         # [TBD-HAZID] maximum wind speed for heave-to [kn]

# D2.1: ToR adaptive matrix [TBD-HAZID]
tor_matrix:
  - {state: 0, tmr_s: 30.0}   # Bridge_OnDuty
  - {state: 1, tmr_s: 60.0}   # Bridge_Nearby
  - {state: 2, tmr_s: 60.0}   # ROC_Attended
  - {state: 3, tmr_s: 90.0}   # Mess_Rest
  - {state: 4, tmr_s: 120.0}  # Cabin_Sleep

# D2.1: ROT_max curve from Capability Manifest (FCB initial values) [TBD-HAZID]
rot_max_curve:
  - {speed_kn: 0.0, rot_max_deg_s: 5.0}
  - {speed_kn: 10.0, rot_max_deg_s: 15.0}
  - {speed_kn: 18.0, rot_max_deg_s: 12.0}
  - {speed_kn: 22.0, rot_max_deg_s: 8.0}

# D2.1: EMA smoothing [TBD-HAZID]
ema:
  tau_s: 5.0

# Environment fallbacks (scenario YAML — used when M3 mission_state unavailable)
environment:
  water_depth_m: 0.0          # default: unknown depth

# System health configuration
# D-DEMO1-R11: redundancy_enabled set true to avoid T_sys_health being capped at
# kSysHealCritical=30s (which further limits TDL). With redundancy=true and no active
# faults, T_sys_health = min(MTTF*0.1, 300) which won't constrain TDL below tdl_min_s.
# [TBD-HAZID]: re-evaluate for real hardware configuration.
system_health:
  redundancy_enabled: true    # DEMO-1: set true so T_sys_health does not cap TDL at 30s

# W9: M3 ACTIVE stale monitoring
m3_route_stale_threshold_s: 15.0
