m3_mission_manager:
  ros__parameters:
    voyage_task:
      departure_distance_max_km: 2.0
      eta_window_min_s: 600
      eta_window_max_s: 259200
      waypoint_max_distance_nm: 50.0
      exclusion_zone_buffer_m: 500.0
    eta:
      sampling_interval_s: 60
      forecast_horizon_max_s: 3600
      sea_current_uncertainty_kn: 0.3
      world_state_age_threshold_s: 0.5
    replan:
      deadline_mrc_required_s: 30.0
      deadline_odd_exit_critical_s: 60.0
      deadline_odd_exit_degraded_s: 120.0
      deadline_mission_infeasible_s: 120.0
      deadline_congestion_s: 300.0
      attempt_max_count: 3
    odd:
      degraded_threshold: 0.7
      critical_threshold: 0.3
      degraded_buffer_s: 1.0
    eta_infeasible_margin_s: 600.0
    mission_goal_publish_rate_hz: 0.5
    asdr_heartbeat_rate_hz: 2.0
    timeout:
      voyage_task_s: 600.0
      planned_route_s: 3.0
      speed_profile_s: 3.0
      odd_state_s: 2.0

    current_error:
      xte_high_nm: 0.5         # [HAZID 校准] L4 XTE HIGH threshold
      xte_medium_nm: 0.3       # [HAZID 校准] L4 XTE MEDIUM threshold
      current_high_kn: 2.0     # [HAZID 校准] sea_current HIGH threshold
      current_medium_kn: 1.5   # [HAZID 校准] sea_current MEDIUM threshold
      l4_stale_s: 2.0          # L4 tracking_error staleness → xte_nm = -1

    l1_watchdog:
      warning_s: 60.0          # [HAZID 校准] L1 dropout → WARNING
      timeout_s: 120.0         # [HAZID 校准] L1 dropout → TIMEOUT + ToR
      confidence_warning: 0.6  # MissionGoal.confidence cap at WARNING
      confidence_timeout: 0.4  # MissionGoal.confidence cap at TIMEOUT
