title: 'Malacca 近海群岛全航路避碰演示'
description: >-
  Malacca 海峡西北向 transit（近海群岛 ODD）。本船沿 5 航点计划航路自主航行；
  运行中按需注入 COLREGs 相遇（对头/交叉/追越）。targetShips 为空——目标全运行时注入。
startTime: '2026-06-09T00:00:00Z'
ownShip:
  static:
    id: 1
    shipType: Cargo
    name: FCB Own Ship
  initial:
    position:
      latitude: 2.500
      longitude: 101.000
    cog: 315.0
    sog: 12.0
    heading: 315.0
  model: fcb_mmg_vessel
  controller: psbmpc_wrapper
  nominalRoute:
  - { latitude: 2.500, longitude: 101.000, target_sog_kn: 12.0 }
  - { latitude: 2.560, longitude: 100.940, target_sog_kn: 12.0 }
  - { latitude: 2.620, longitude: 100.880, target_sog_kn: 12.0 }
  - { latitude: 2.680, longitude: 100.820, target_sog_kn: 12.0 }
  - { latitude: 2.740, longitude: 100.760, target_sog_kn: 12.0 }
targetShips: []
environment:
  wind: &id001 { dir_deg: 0.0, speed_mps: 0.0 }
  current: &id002 { dir_deg: 0.0, speed_mps: 0.0 }
  visibility_nm: 6.0
metadata:
  schema_version: '3.0'
  scenario_id: malacca-archipelago-transit
  scenario_source: d1.8_demo
  vessel_class: FCB
  odd_cell:
    domain: coastal_archipelago
  seed: 108
  expected_outcome:
    cpa_min_m_ge: 500.0
  simulation_settings:
    total_time: 1200.0
    dt: 0.02
    n_rps_initial: 3.5
    coordinate_origin: [2.500, 101.000]
    dynamics_mode: internal
    backend: ros2
  disturbance:
    wind: *id001
    current: *id002
