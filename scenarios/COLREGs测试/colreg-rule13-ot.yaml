title: 'Probe: Rule 13 overtaking'
description: 'Rule 13 overtaking. Own ship 000deg/14kn overtakes a slow 7kn vessel
  nearly dead ahead (relative bearing 1deg, same course), initial range 1.3 NM,
  t_cpa ~= 666s (< t_plan 720s so M6 ESM onset fires). Own is the give-way vessel
  and must keep clear (conventionally a STARBOARD pass) and COMPLETE the overtake —
  own ship is finally past and clear (Rule 13(b)) when her bow draws ahead of the
  overtaken vessel by at least one ship length along the course axis. Rule 13(d):
  the bearing drawing aft as own passes must NOT reclassify this into a crossing.'
