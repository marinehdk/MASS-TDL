title: 'Probe: Rule 17 stand-on (target from port, never yields)'
description: Rule 17 stand-on. Target crosses from own ship's PORT bow (relative bearing
  315deg), course 090deg at 10.0kn, t_cpa ~= 509s. Own has the target on its PORT
  side -> own is the STAND-ON vessel and must initially KEEP course and speed (Rule
  17(a)(i)). The give-way target holds course (straight-line replay) and never acts,
  so own must take last-moment independent action (Rule 17(b)) to keep the ship-domain
  clear. Probes that own does NOT give way prematurely (no early large alteration).
