title: 'Probe: head-on/crossing edge (rel_brg 25deg, starboard)'
description: Classification-boundary probe at the HEAD-ON / CROSSING edge. Target
  just OUTSIDE the head-on cone on the starboard bow (relative bearing 25deg), course
  215deg at 13.4kn, initial range 5.0 NM, t_cpa ~= 990s. Should be handled as a
  starboard crossing give-way (Rule 15), NOT a head-on — but the geometry is close
  enough to the cone that a misclassification would flip the maneuver. The scenario
  starts in PREPLAN, then reaches ACTIVE after about 270s.
