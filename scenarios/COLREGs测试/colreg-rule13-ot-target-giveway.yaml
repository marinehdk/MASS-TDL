title: 'Probe: Rule 13 overtaking — target as give-way (intelligent)'
description: 'Rule 13 overtaking with the FSM-controlled target vessel as the
  OVERTAKING give-way vessel. Own ship sails north at 8 kn; a faster target
  (16 kn, same course) closes from dead astern of own (relative bearing ~180°,
  initial range 0.5 NM). Per Rule 13 the overtaking vessel — the target — must
  keep clear of the overtaken stand-on vessel (own). The target FSM is expected
  to turn starboard and open CPA, then return to its nominal northbound route.
  Own ship, as stand-on, holds course and speed. Validates the Rule 13 give-way
  path of the target COLREGs FSM and complements rule13-ot (where own is the
  overtaker).'
