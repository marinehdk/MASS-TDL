<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASS L3 TDL — Collision Avoidance Pipeline</title>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a1628;color:#c8d6e5;font-family:'SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden}

/* ── App Shell ── */
#app{display:flex;flex-direction:column;height:100vh;position:relative}

/* ── Header ── */
header{flex-shrink:0;padding:12px 24px;background:linear-gradient(180deg,#0f2040 0%,#0a1628 100%);border-bottom:1px solid rgba(0,180,216,.15);display:flex;flex-wrap:wrap;align-items:center;gap:12px;z-index:10}
header h1{font-size:18px;font-weight:600;letter-spacing:.03em;color:#e0e8f0;margin-right:auto}
header h1 .accent{color:#00b4d8}
header .subtitle{font-size:11px;color:#5a7a9a;font-weight:400;letter-spacing:.06em;margin-left:8px}
.header-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toggle-group{display:flex;border-radius:6px;overflow:hidden;border:1px solid rgba(0,180,216,.2)}
.toggle-btn{padding:6px 14px;font-size:12px;font-weight:500;background:transparent;color:#5a7a9a;border:none;cursor:pointer;transition:.2s;font-family:inherit}
.toggle-btn:hover{color:#c8d6e5;background:rgba(0,180,216,.08)}
.toggle-btn.active{color:#00b4d8;background:rgba(0,180,216,.15);box-shadow:inset 0 1px 0 rgba(0,180,216,.2)}
.toggle-btn[data-mode="doer"].active{color:#2a9d8f;background:rgba(42,157,143,.15)}
.toggle-btn[data-mode="checker"].active{color:#e76f51;background:rgba(231,111,81,.15)}
.zoom-group{display:flex;gap:2px;border-left:1px solid rgba(255,255,255,.08);padding-left:10px}
.zoom-btn{width:28px;height:28px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#7a9aba;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;font-family:inherit}
.zoom-btn:hover{background:rgba(0,180,216,.12);color:#00b4d8;border-color:rgba(0,180,216,.25)}
.zoom-btn.reset{width:auto;padding:0 10px;font-size:11px}

/* ── Legend ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;padding-top:6px;width:100%;border-top:1px solid rgba(255,255,255,.04)}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#7a9aba}
.legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend-swatch.green{background:#2a9d8f}
.legend-swatch.blue{background:#2479d9}
.legend-swatch.amber{background:#e76f51}
.legend-swatch.purple{background:#8b5cf6}
.legend-line{display:flex;align-items:center;gap:4px}
.legend-line svg{width:20px;height:4px}
.usages{margin-left:auto;font-size:10px;color:#3a5a7a;letter-spacing:.04em}

/* ── Main Layout ── */
main{flex:1;position:relative;overflow:hidden;display:flex}
#diagram-container{flex:1;overflow:hidden;position:relative;cursor:grab}
#diagram-container:active{cursor:grabbing}
#diagram{width:100%;height:100%;display:block}

/* ── Detail Panel ── */
#detail-panel{position:absolute;top:0;right:-420px;width:400px;height:100%;background:linear-gradient(180deg,#0f1f38 0%,#0a1628 100%);border-left:1px solid rgba(0,180,216,.15);overflow-y:auto;transition:right .35s cubic-bezier(.4,0,.2,1);z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
#detail-panel.open{right:0}
#detail-panel .panel-header{position:sticky;top:0;background:rgba(10,22,40,.92);backdrop-filter:blur(8px);padding:16px 20px;border-bottom:1px solid rgba(0,180,216,.12);display:flex;align-items:center;gap:12px;z-index:1}
#detail-panel .panel-header h2{font-size:16px;font-weight:600;flex:1;color:#e0e8f0}
#detail-panel .panel-header .module-tag{font-size:11px;background:rgba(0,180,216,.12);color:#00b4d8;padding:2px 10px;border-radius:10px;font-weight:500}
#detail-panel .panel-close{width:28px;height:28px;border-radius:4px;border:none;background:rgba(255,255,255,.05);color:#5a7a9a;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
#detail-panel .panel-close:hover{background:rgba(231,111,81,.15);color:#e76f51}
#detail-panel .panel-body{padding:16px 20px 40px}
#detail-panel .panel-section{margin-bottom:20px}
#detail-panel .panel-section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#5a7a9a;margin-bottom:8px;font-weight:600}
#detail-panel .panel-section p{font-size:13px;line-height:1.6;color:#a0b8d0}
#detail-panel .panel-section .freq-badge{display:inline-block;background:rgba(0,180,216,.1);color:#00b4d8;padding:2px 10px;border-radius:8px;font-size:12px;font-weight:500}
.topic-table{width:100%;border-collapse:collapse;font-size:12px}
.topic-table th{text-align:left;padding:6px 8px;color:#5a7a9a;font-weight:500;border-bottom:1px solid rgba(255,255,255,.06);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.topic-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04);color:#b0c8e0;vertical-align:top;font-size:12px}
.topic-table td:first-child{font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:11px;color:#00b4d8;white-space:nowrap}
.topic-table tr:last-child td{border-bottom:none}
.source-list{list-style:none;padding:0}
.source-list li{padding:5px 0;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:11px;color:#7a9aba;border-bottom:1px solid rgba(255,255,255,.04)}
.source-list li:last-child{border-bottom:none}
.source-list li::before{content:"› ";color:#00b4d8;font-weight:700}
.panel-empty{display:flex;align-items:center;justify-content:center;height:200px;color:#3a5a7a;font-size:14px;font-style:italic}

/* ── Timeline ── */
#timeline-bar{flex-shrink:0;height:48px;background:linear-gradient(0deg,#060e1a 0%,#0a1628 100%);border-top:1px solid rgba(0,180,216,.08);display:flex;align-items:center;padding:0 24px;overflow:hidden}
#timeline-bar .tl-label{font-size:10px;color:#3a5a7a;margin-right:12px;white-space:nowrap;letter-spacing:.04em;font-weight:500}
#timeline-bar .tl-track{flex:1;height:2px;background:rgba(255,255,255,.06);border-radius:1px;position:relative;margin:0 8px}
#timeline-bar .tl-marker{position:absolute;top:-5px;width:1px;height:12px;background:#3a5a7a}
#timeline-bar .tl-marker.active{background:#00b4d8;height:16px;top:-7px}
#timeline-bar .tl-marker.active::after{content:attr(data-label);position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:9px;color:#00b4d8;white-space:nowrap}
#timeline-bar .tl-marker::after{content:attr(data-label);position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:8px;color:#3a5a7a;white-space:nowrap}

/* ── SVG Node Styles ── */
.node{cursor:pointer;transition:opacity .3s}
.node:hover .node-rect{filter:brightness(1.3);stroke-width:2}
.node:hover .node-rect-shadow{opacity:.4}
.node-rect{transition:.2s}
.node-rect-shadow{opacity:.08;transition:.2s}
.node-label{font-size:14px;font-weight:600;fill:#e0e8f0;text-anchor:middle;dominant-baseline:central}
.node-sub{font-size:10px;fill:#5a7a9a;text-anchor:middle;dominant-baseline:central}
.node-freq{font-size:9px;fill:#3a5a7a;text-anchor:middle}
.node-number{font-size:22px;font-weight:700;text-anchor:middle;fill:rgba(255,255,255,.08);dominant-baseline:central}
.node-badge{font-size:8px;font-weight:600;text-anchor:middle;fill:#0a1628;dominant-baseline:central}
.node-code{font-size:8px;fill:rgba(255,255,255,.15);text-anchor:middle;dominant-baseline:central;font-family:'SF Mono',monospace}

/* ── Edge Styles ── */
.edge-path{fill:none;stroke-width:2;stroke-linecap:round;stroke:#2a5a8a;transition:opacity .4s,stroke .3s}
.edge-path.highlight{stroke:#00b4d8;stroke-width:2}
.edge-path.doer-path{stroke:#2a9d8f;stroke-width:2.5;stroke-dasharray:none}
.edge-path.checker-path{stroke:#e76f51;stroke-width:2.5;stroke-dasharray:6,3}
.edge-label{font-size:9px;fill:#6a9aba;text-anchor:middle;transition:opacity .3s;font-family:'SF Mono','Fira Code',monospace}
.edge-label.doer-path{fill:#3acFA0}
.edge-label.checker-path{fill:#f08060}
.edge-label.highlight{fill:#00b4d8;font-size:10px}
.edge-label .msg-type{fill:#3a5a7a;font-size:7px}
.edge-arrow{fill:#2a5a8a;transition:opacity .3s}
.edge-arrow.highlight{fill:#00b4d8}
.edge-arrow.doer-path{fill:#2a9d8f}
.edge-arrow.checker-path{fill:#e76f51}

/* ── Layer Background ── */
.layer-bg{pointer-events:none;transition:opacity .3s}
.layer-label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-anchor:middle}
.layer-label-sub{font-size:9px;font-weight:400;letter-spacing:.04em;text-anchor:middle;opacity:.5}

/* ── Dead Code Stamp ── */
.dead-stamp{opacity:.5}
.dead-stamp rect{stroke-dasharray:4,3}

/* ── Module Tag in node ── */
.module-tag-bg{opacity:.1}

/* ── Pulse Animation ── */
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
.edge-path.pulsing{animation:pulse 2s ease-in-out infinite}

/* ── Scrollbar ── */
#detail-panel::-webkit-scrollbar{width:4px}
#detail-panel::-webkit-scrollbar-track{background:transparent}
#detail-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}
#detail-panel::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.15)}

/* ── Responsive ── */
@media(max-width:900px){header h1{font-size:15px}.legend{order:10}.usages{display:none}#detail-panel{width:320px;right:-340px}}
@media(max-width:600px){header{padding:8px 12px;gap:6px}header h1{font-size:13px}.toggle-btn{padding:4px 8px;font-size:10px}.legend-item{font-size:9px}#detail-panel{width:100%;right:-100%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⛵ MASS L3 <span class="accent">TDL</span> — Collision Avoidance Pipeline</h1>
    <div class="header-controls">
      <div class="toggle-group">
        <button class="toggle-btn active" data-mode="all">All Paths</button>
        <button class="toggle-btn" data-mode="doer">Doer Path</button>
        <button class="toggle-btn" data-mode="checker">Checker Path</button>
      </div>
      <div class="zoom-group">
        <button class="zoom-btn" id="zoom-in" title="Zoom In">⊕</button>
        <button class="zoom-btn" id="zoom-out" title="Zoom Out">⊖</button>
        <button class="zoom-btn reset" id="zoom-reset" title="Reset View">⟲ Fit</button>
      </div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch green"></span>Envelope Control (M1)</span>
      <span class="legend-item"><span class="legend-swatch blue"></span>Decision &amp; Planning (M2–M6)</span>
      <span class="legend-item"><span class="legend-swatch amber"></span>Safety &amp; HMI (M7–M8)</span>
      <span class="legend-item"><span class="legend-swatch purple"></span>External / Cross-Layer</span>
      <span class="legend-item">
        <span class="legend-line">
          <svg viewBox="0 0 20 4"><line x1="0" y1="2" x2="20" y2="2" stroke="#2a9d8f" stroke-width="2"/></svg>
        </span>Doer Path
      </span>
      <span class="legend-item">
        <span class="legend-line">
          <svg viewBox="0 0 20 4"><line x1="0" y1="2" x2="20" y2="2" stroke="#e76f51" stroke-width="2" stroke-dasharray="4,2"/></svg>
        </span>Checker Path
      </span>
      <span class="usages">click any node → detail panel · scroll to zoom · drag to pan</span>
    </div>
  </header>

  <main>
    <div id="diagram-container">
      <svg id="diagram" viewBox="0 0 1400 950" preserveAspectRatio="xMidYMid meet">
        <defs>
          <marker id="arrow-blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 3 L 0 6 Z" fill="#00b4d8"/>
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 3 L 0 6 Z" fill="#2a9d8f"/>
          </marker>
          <marker id="arrow-amber" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 3 L 0 6 Z" fill="#e76f51"/>
          </marker>
          <marker id="arrow-dim" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 3 L 0 6 Z" fill="#00b4d8"/>
          </marker>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
          </filter>
        </defs>
        <rect width="1400" height="950" fill="#0a1628"/>
        <g id="layers"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </div>
    <aside id="detail-panel">
      <div class="panel-header">
        <h2>Module Details</h2>
        <span class="module-tag" id="panel-tag"></span>
        <button class="panel-close" id="panel-close">✕</button>
      </div>
      <div class="panel-body" id="panel-body">
        <div class="panel-empty">Click a node to see module details</div>
      </div>
    </aside>
  </main>

  <div id="timeline-bar">
    <span class="tl-label">◈ FREQ</span>
    <div class="tl-track" id="tl-track"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
// MODULE DATA
// ═══════════════════════════════════════════════════
const MODULES = {
  l2: {

    layer:'ext',

  m7: {
    id:'m7', label:'Safety Supervisor', abbr:'M7',

const svg = document.getElementById('diagram');
const NS = 'http://www.w3.org/2000/svg';
let currentMode = 'all';

// ── Helper: create SVG element ──
function el(tag, attrs={}, children=[]) {
  const e = document.createElementNS(NS, tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
  children.forEach(c => {
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else if(c instanceof Node) e.appendChild(c);
  });
  return e;
}

// ── Helper: get node edge point ──
function getEdgePt(mod, side, offset=0) {
  const {x,y,w,h} = mod;
  switch(side) {
    case 'top':    return {x:x+offset, y:y-h/2};
    case 'bottom': return {x:x+offset, y:y+h/2};
    case 'left':   return {x:x-w/2, y:y+offset};
    case 'right':  return {x:x+w/2, y:y+offset};
    default:       return {x, y};
  }
}

// ── Helper: bezier curve path ──
function bezierPath(sx, sy, tx, ty) {
  const dx = tx - sx, dy = ty - sy;
  const adx = Math.abs(dx), ady = Math.abs(dy);
  let cpx1, cpy1, cpx2, cpy2;
  if(adx > ady) {
    // horizontal dominant
    const midX = (sx + tx) / 2;
    cpx1 = midX; cpy1 = sy;
    cpx2 = midX; cpy2 = ty;
  } else {
    // vertical dominant
    const midY = (sy + ty) / 2;
    cpx1 = sx; cpy1 = midY;
    cpx2 = tx; cpy2 = midY;
  }
  return `M ${sx} ${sy} C ${cpx1} ${cpy1}, ${cpx2} ${cpy2}, ${tx} ${ty}`;
}

// ── Render Edges ──
function renderEdges() {
  const g = document.getElementById('edges');
  const nodeLookup = (id) => MODULES[id] || EXT_NODES.find(e => e.id === id);
  EDGES.forEach((edge, i) => {
    const src = nodeLookup(edge.from), tgt = nodeLookup(edge.to);
    if(!src || !tgt) return;

    const sp = getEdgePt(src, edge.fs, edge.offsetX||0);
    const tp = getEdgePt(tgt, edge.ts, edge.offsetY||0);
    const d = bezierPath(sp.x, sp.y, tp.x, tp.y);
    const pathClass = ['edge-path', edge.path+'-path', edge.path === 'both' ? 'highlight' : ''].filter(Boolean).join(' ');

    const marker = 'url(#arrow-' + (edge.path === 'doer' ? 'green' : edge.path === 'checker' ? 'amber' : 'dim') + ')';
    const path = el('path', {
      d, class:pathClass,
      'data-from':edge.from, 'data-to':edge.to,
      'marker-end': marker
    });
    g.appendChild(path);

    // Label
    const midX = (sp.x + tp.x) / 2;
    const midY = (sp.y + tp.y) / 2;
    const labelLines = [edge.topic, `${edge.msgType}  ${edge.freq}`];
    const labelG = el('g', {class:'edge-label-wrapper'});
    const bg = el('rect', {fill:'#0a1628', rx:3, opacity:.85});
    labelG.appendChild(bg);

    labelLines.forEach((line, li) => {
      const t = el('text', {
        x:midX, y:midY-6 + li*14, class:'edge-label ' + (edge.path !== 'both' ? edge.path+'-path' : 'highlight'),
        'font-size': li === 0 ? 9 : 8, fill: li === 0 ? '#90b8d0' : '#5a8aaa', 'font-weight': li === 0 ? '500' : '400'
      }, [line]);
      labelG.appendChild(t);
    });

    // background rect sizing (approximate)
    const longestLine = Math.max(...labelLines.map(l => l.length)) * 5.5;
    bg.setAttribute('x', midX - longestLine/2 - 3);
    bg.setAttribute('y', midY - 16);
    bg.setAttribute('width', longestLine + 6);
    bg.setAttribute('height', 32);

    g.appendChild(labelG);
  });
}

    mod.subs.forEach(s => {
      html += `<tr><td>${s.topic}</td><td>${s.type}</td><td>${s.freq}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // Publications
  if(mod.pubs && mod.pubs.length) {
    html += `<div class="panel-section"><h3>Publications</h3><table class="topic-table">
      <tr><th>Topic</th><th>Type</th><th>Freq</th></tr>`;
    mod.pubs.forEach(p => {
      html += `<tr><td>${p.topic}</td><td>${p.type}</td><td>${p.freq}</td></tr>`;
    });
    html += `</table></div>`;
  }

  // Sources
  if(mod.sources && mod.sources.length) {
    html += `<div class="panel-section"><h3>Key Source Files</h3><ul class="source-list">`;
    mod.sources.forEach(s => {
      html += `<li>${s}</li>`;
    });
    html += `</ul></div>`;
  }

  if(dead) {
    html += `<div class="panel-section" style="background:rgba(231,111,81,.06);border:1px solid rgba(231,111,81,.15);border-radius:6px;padding:12px;margin-top:12px;">
      <h3 style="color:#e76f51;">⚠️ Dead Code Notice</h3>
      <p style="font-size:12px;color:#c8a090;">BC-MPC subscribes to <code style="color:#e76f51;">/m2/world_state</code> instead of <code style="color:#00b4d8;">/l3/m2/world_state</code>. The topic mismatch causes an indefinite wait for valid state. Fix: correct the subscription topic in bc_mpc_node.cpp:35 and update the CMakeLists node name collision.</p>
    </div>`;
  }

  panelBody.innerHTML = html;
  panel.classList.add('open');
}

function hideDetail() {
  panel.classList.remove('open');
}

// ═══════════════════════════════════════════════════
// PATH HIGHLIGHTING
// ═══════════════════════════════════════════════════
function setMode(mode) {
  currentMode = mode;
  // Update buttons
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });

  // Update edges
  document.querySelectorAll('.edge-path').forEach(path => {
    const from = path.dataset.from, to = path.dataset.to;
    // Find edge data
    const edge = EDGES.find(e => e.from === from && e.to === to);
    if(!edge) return;

    if(mode === 'all') {
      path.style.opacity = '1';
      path.style.stroke = edge.path === 'doer' ? '#2a9d8f' : edge.path === 'checker' ? '#e76f51' : '#00b4d8';
      path.style.strokeWidth = edge.path === 'both' ? '2' : '2.5';
      if(edge.path === 'checker') path.style.strokeDasharray = '6,3';
      else path.style.strokeDasharray = 'none';
    } else if(mode === 'doer') {
      const show = edge.path === 'doer' || edge.path === 'both';
      path.style.opacity = show ? '1' : '.08';
      if(show) {
        path.style.stroke = edge.path === 'both' ? '#00b4d8' : '#2a9d8f';
        path.style.strokeWidth = '2.5';
        path.style.strokeDasharray = 'none';
      }
    } else if(mode === 'checker') {
      const show = edge.path === 'checker' || edge.path === 'both';
      path.style.opacity = show ? '1' : '.08';
      if(show) {
        path.style.stroke = edge.path === 'both' ? '#00b4d8' : '#e76f51';
        path.style.strokeWidth = '2.5';
        path.style.strokeDasharray = edge.path === 'checker' ? '6,3' : 'none';
      }
    }
  });

  // Update labels
  document.querySelectorAll('.edge-label').forEach(label => {
    const wrapper = label.closest('.edge-label-wrapper');
    if(!wrapper) return;
    // Find which edge this belongs to by looking for nearby path
    const parentG = wrapper.parentElement;
    if(!parentG) return;
    // Simple approach: just toggle classes based on currentMode
    if(currentMode === 'all') {
      label.style.opacity = '1';
    } else if(currentMode === 'doer') {
      const isDoer = label.classList.contains('doer-path');
      label.style.opacity = (isDoer || label.classList.contains('highlight')) ? '1' : '.1';
    } else if(currentMode === 'checker') {
      const isChecker = label.classList.contains('checker-path');
      label.style.opacity = (isChecker || label.classList.contains('highlight')) ? '1' : '.1';
    }
  });
}

// ═══════════════════════════════════════════════════
// ZOOM / PAN
// ═══════════════════════════════════════════════════
let zoomLevel = 1;
let panX = 0, panY = 0;
let isDragging = false, dragStartX, dragStartY, dragPanX, dragPanY;
const container = document.getElementById('diagram-container');
const diagram = document.getElementById('diagram');

function applyTransform() {
  diagram.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
  diagram.style.transformOrigin = '0 0';
}

container.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? .9 : 1.1;
  const newZoom = Math.max(.3, Math.min(3, zoomLevel * delta));
  // Zoom toward mouse
  const rect = container.getBoundingClientRect();
  const mx = e.clientX - rect.left - panX;
  const my = e.clientY - rect.top - panY;
  panX -= mx * (newZoom / zoomLevel - 1);
  panY -= my * (newZoom / zoomLevel - 1);
  zoomLevel = newZoom;
  applyTransform();
}, {passive:false});

container.addEventListener('mousedown', e => {
  if(e.target.closest('.node') || e.button !== 0) return;
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragPanX = panX;
  dragPanY = panY;
  container.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if(!isDragging) return;
  panX = dragPanX + (e.clientX - dragStartX);
  panY = dragPanY + (e.clientY - dragStartY);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  if(isDragging) {
    isDragging = false;
    container.style.cursor = 'grab';
  }
});

document.getElementById('zoom-in').addEventListener('click', () => {
  zoomLevel = Math.min(3, zoomLevel * 1.3);
  applyTransform();
});
document.getElementById('zoom-out').addEventListener('click', () => {
  zoomLevel = Math.max(.3, zoomLevel / 1.3);
  applyTransform();
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoomLevel = 1;
  panX = 0;
  panY = 0;
  applyTransform();
});

// ═══════════════════════════════════════════════════
// EVENT DELEGATION
// ═══════════════════════════════════════════════════
document.getElementById('nodes').addEventListener('click', e => {
  const g = e.target.closest('.node');
  if(!g) return;
  showDetail(g.dataset.id);
});

document.getElementById('panel-close').addEventListener('click', hideDetail);

// Click outside panel to close
document.getElementById('diagram-container').addEventListener('click', e => {
  if(!e.target.closest('.node')) hideDetail();
});

// Escape key to close
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') hideDetail();
});

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

renderLayers();
renderNodes();
renderExtNodes();
renderEdges();
renderTimeline();

// Click L2 to show example
setTimeout(() => showDetail('m4'), 500);
</script>
